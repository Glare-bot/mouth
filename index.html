const container = document.getElementById("mouths");

let lastImage = -1;


/* Elegir una imagen aleatoria diferente a la anterior */

function getRandomImage() {

    if (images.length === 1) {
        return 0;
    }

    let index;

    do {
        index = Math.floor(Math.random() * images.length);
    } while (index === lastImage);

    lastImage = index;

    return index;
}


/* Crear una boca */

function createMouth() {

    if (images.length === 0) {
        return;
    }

    const img = document.createElement("img");

    const imageIndex = getRandomImage();

    img.src = "mouths/" + images[imageIndex];

    img.className = "mouth";


    /* Tamaño mínimo grande */

    let size = 18 + Math.random() * 27;


    /* Algunas pueden ser gigantes */

    if (Math.random() < 0.18) {
        size = 45 + Math.random() * 35;
    }

    img.style.width = size + "vw";


    /* Posición aleatoria */

    const x = -15 + Math.random() * 130;
    const y = -15 + Math.random() * 130;

    img.style.left = x + "vw";
    img.style.top = y + "vh";


    /*
        Solamente 0° o 180°.
        Nunca diagonal.
    */

    const rotation = Math.random() < 0.5 ? 0 : 180;

    const scale = 0.85 + Math.random() * 0.3;

    img.style.transform =
        `rotate(${rotation}deg) scale(${scale})`;


    /* 100% opaca */

    img.style.opacity = "1";


    /* Superposición */

    img.style.zIndex =
        Math.floor(Math.random() * 1000);


    /* Aparece instantáneamente */

    container.appendChild(img);


    /*
        Después de 12–24 segundos
        desaparece instantáneamente.
    */

    setTimeout(() => {

        if (img.parentNode) {
            img.remove();
        }

    }, 12000 + Math.random() * 12000);

}


/* Primeras bocas */

for (let i = 0; i < 8; i++) {
    createMouth();
}


/* Una boca nueva cada 0.3 segundos */

setInterval(() => {

    createMouth();

}, 300);
